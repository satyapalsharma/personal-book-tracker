# CodeCov configuration
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        # Minimum coverage ratio for the project
        target: auto
        # Allow coverage to drop by 1% without failing
        threshold: 1%
    patch:
      default:
        # Minimum coverage ratio for the patch
        target: auto
        # Allow patch coverage to drop by 5% without failing
        threshold: 5%

ignore:
  - "src/**/*.test.*"
  - "src/**/__tests__/**"
  - "src/**/*.spec.*"
  - "*.config.*"
  - "vite.config.*"
  - "postcss.config.*"
  - "tailwind.config.*"
